[package]
name = "stuffcloud-mail"
description = "stuffcloud mail delivery: the message, the SMTP transport and a recording transport for tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# TLS for the SMTP connection (STARTTLS and SMTPS) with rustls, the ring crypto provider and the
# system's root certificates. On by default; `none` as the security mode works without it.
default = ["tls"]
tls = ["lettre/tokio1-rustls", "lettre/rustls-native-certs", "lettre/ring"]

[dependencies]
lettre.workspace = true
stuffcloud-core.workspace = true

[dev-dependencies]
rcgen.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt", "macros", "sync", "time"] }
tokio-rustls.workspace = true

[lints]
workspace = true
