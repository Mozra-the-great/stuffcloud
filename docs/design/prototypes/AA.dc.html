<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>stuffcloud paste text</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="stuff.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</helmet>
<div class="frame">
<header class="hdr"><div class="hdr-l"><a class="brand" href="#"><img src="logo.svg" alt=""><span>stuffcloud</span></a><nav class="nav" aria-label="Main"><a href="#">Tools</a><a href="#" aria-current="page">Hosting</a><a href="#">Docs</a></nav></div><div class="hdr-r"><a href="#">Log in</a></div><button class="menu-btn" type="button" aria-label="Open menu"><svg width="20" height="14" viewBox="0 0 20 14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M0 1h20M0 7h20M0 13h20"/></svg></button></header>

<form class="split" onSubmit="{{noop}}" style="margin:0">
<main class="main">
<div class="stack-s"><p class="eyebrow">hosting / new / text</p><h1 class="title">Paste text</h1></div>

<div class="tabs" role="tablist" aria-label="Files in this paste" style="border:1px solid var(--line)">
<a href="#" role="tab" aria-selected="true" aria-current="page">notes.md</a><a href="#" role="tab">todo.txt</a><a href="#" role="tab" style="color:var(--lilac)">+ Add file</a>
</div>

<div class="row row-m" style="flex-wrap:nowrap">
<div class="fld" style="flex:1 1 240px"><label class="label" for="fn">File name</label><input class="field" id="fn" type="text" value="notes.md"></div>
<div class="fld" style="flex:0 1 220px"><label class="label" for="lang">Language</label><select class="field" id="lang"><option>Markdown (rendered)</option><option>Plain text</option><option>JavaScript</option><option>Python</option><option>Shell</option></select></div>
</div>

<div class="fld"><label class="label" for="body">Content</label><textarea class="field" id="body" style="min-height:360px">## Shopping list

- coffee
- oat milk
- 12 AA batteries</textarea></div>
</main>

<aside class="side">
<div class="pad stack" style="gap:26px">
<div class="fld"><label class="label" for="zone">Domain</label><select class="field" id="zone"><option>sites.test · internal</option><option>sites.example.org · public (login)</option></select>
<div class="row" style="flex-wrap:nowrap"><input class="field" aria-label="Subdomain" value="k3x9q2mf"><button class="btn btn-ghost btn-icon" type="button" aria-label="Generate a new random subdomain"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 2v3.5h-3.5"/></svg></button></div>
<span class="mono" style="font-size:13px;color:var(--lilac);word-break:break-all">https://k3x9q2mf.sites.test</span></div>

<fieldset style="margin:0;padding:0;border:0;min-width:0"><legend class="label" style="padding:0;margin-bottom:12px">Expires</legend>
<div class="row"><label style="position:relative"><input class="opt" type="radio" name="e"><span class="box">1h</span></label><label style="position:relative"><input class="opt" type="radio" name="e"><span class="box">1d</span></label><label style="position:relative"><input class="opt" type="radio" name="e" checked><span class="box">7d</span></label><label style="position:relative"><input class="opt" type="radio" name="e"><span class="box">30d</span></label></div></fieldset>

<fieldset style="margin:0;padding:0;border:0;min-width:0"><legend class="label" style="padding:0;margin-bottom:12px">Who can edit</legend>
<div class="stack-s"><label style="position:relative;display:block"><input class="opt" type="radio" name="w" checked><span class="box" style="justify-content:flex-start">Anyone with the edit link</span></label><label style="position:relative;display:block"><input class="opt" type="radio" name="w"><span class="box" style="justify-content:flex-start">Only me (login)</span></label></div></fieldset>

<fieldset style="margin:0;padding:0;border:0;min-width:0"><legend class="label" style="padding:0;margin-bottom:8px">Protect</legend>
<label class="toggle"><input type="checkbox">Password</label><label class="toggle"><input type="checkbox">Burn after reading</label></fieldset>

<button class="btn" type="submit">Publish</button>
</div>
<div class="panel" style="flex:1;border-top:1px solid var(--line);--mh:180px;--mhm:140px"><div class="b1" style="left:40px;top:30px;width:80px;height:40px"></div><img class="st" src="letter.svg" alt="" style="right:40px;top:30px;width:50px;transform:rotate(8deg)"><img class="axo axo-s bob" src="axo.svg" alt="Stuffy, the stuffcloud mascot"></div>
</aside>
</form>

<footer class="foot"><div>stuffcloud · GPL-3.0 · no trackers</div><span><a href="#">Source</a><a href="#">Privacy</a><a href="#">Report abuse</a></span></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1100}}'>
class Component extends DCLogic {
renderVals() {
return { noop: (e) => { if (e && e.preventDefault) e.preventDefault(); } };
}
}
</script>
</body>
</html>
