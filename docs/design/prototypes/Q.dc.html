<form onSubmit="{{noop}}" style="margin: 0; display: flex; flex-direction: column; gap: 24px">

<label for="code" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 1px; color: #a2a2ab">6-DIGIT CODE</label>

<div aria-hidden="true" style="display: flex; align-items: center; pointer-events: none">

<span style="width: 20px; height: 2px; background: #a2a2ab; margin: 0 18px"></span>
<span class="cell" style="display: flex; align-items: center; justify-content: center; box-sizing: border-box; width: 60px; height: 76px; border: 1px solid #3a3a42; margin-right: 8px; font-family: 'JetBrains Mono', monospace; font-size: 36px"><span style="color: #f4f4f0">{{d3}}</span><span style="color: #3a3a42">{{p3}}</span></span>
<span class="cell" style="display: flex; align-items: center; justify-content: center; box-sizing: border-box; width: 60px; height: 76px; border: 1px solid #3a3a42; margin-right: 8px; font-family: 'JetBrains Mono', monospace; font-size: 36px"><span style="color: #f4f4f0">{{d4}}</span><span style="color: #3a3a42">{{p4}}</span></span>
<span class="cell" style="display: flex; align-items: center; justify-content: center; box-sizing: border-box; width: 60px; height: 76px; border: 1px solid #3a3a42; font-family: 'JetBrains Mono', monospace; font-size: 36px"><span style="color: #f4f4f0">{{d5}}</span><span style="color: #3a3a42">{{p5}}</span></span>
</div>
<input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" value="{{code}}" onChange="{{onCode}}" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; margin: 0; opacity: 0; font-size: 16px; cursor: text">
</div>
</div>
<button class="btn-solid" type="submit" style="min-height: 56px; background: #f4f4f0; color: #101012; border: 0; font-weight: 600; font-size: 16px; cursor: pointer">Verify</button>
</form>

<div style="display: flex; flex-direction: column; border-top: 1px solid #26262b">
<a class="link" href="#" style="display: flex; align-items: center; min-height: 52px; font-size: 15px; border-bottom: 1px solid #26262b">Use a recovery code</a>
<a class="link" href="#" style="display: flex; align-items: center; min-height: 52px; font-size: 15px; border-bottom: 1px solid #26262b">Use a passkey instead</a>
<a class="link" href="#" style="display: flex; align-items: center; min-height: 52px; font-size: 15px">Back to log in</a>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1000}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { code: '' };
}
renderVals() {
const code = this.state.code || '';
const vals = {
noop: (e) => { if (e && e.preventDefault) e.preventDefault(); },
code: code,
onCode: (e) => { this.setState({ code: String(e.target.value).replace(/\D/g, '').slice(0, 6) }); }
};
for (let i = 0; i < 6; i++) {
vals['d' + i] = code[i] || '';
vals['p' + i] = code[i] ? '' : '0';
}
return vals;
}
}
</script>
