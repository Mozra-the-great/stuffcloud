# Tests may panic: a failed unwrap there is a failed test, not a crash on input.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# Product names that rustdoc prose uses without backticks (".." keeps clippy's defaults).
doc-valid-idents = ["SQLite", "OpenAPI", "OpenMetrics", ".."]
