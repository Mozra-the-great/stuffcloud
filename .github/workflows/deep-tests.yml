name: Deep tests

# The long runs that do not fit into a PR: hours of fuzzing that grow the shared
# corpus, the full mutation run (Rust, the Python CI helpers with mutmut, and the TypeScript logic of web/ with StrykerJS, on demand until its survivors are closed), Miri (undefined behaviour, including inside
# dependencies), property tests with a hundred times more cases, a fresh RustSec
# advisory check (a new advisory needs no code change to matter) and the beta
# toolchain (breakage before the next pin bump).
#
# Not a required check: it runs nightly on main and on demand. A failed
# scheduled run is mailed by GitHub to whoever last changed the cron line; treat
# it like a red PR. Fuzz crashes are attached to the run as artifacts; turn each
# into a regression test (crates/*/tests/regression.rs) and a seed in fuzz/seeds/.

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deep-tests
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Pinned nightly for cargo-fuzz and Miri; bump together with ci.yml.
  NIGHTLY: nightly-2026-11-01
  # Explicit fuzz target: the prebuilt cargo-fuzz from install-action is a musl
  # binary and would otherwise default to x86_64-unknown-linux-musl, where
  # AddressSanitizer cannot link (statically linked libc).
  FUZZ_TARGET_TRIPLE: x86_64-unknown-linux-gnu

jobs:
  fuzz-long:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        target: [safe_rel_path, subdomain, entity_tags, write_query, writable_body, cookie_header, origin, csrf_check, authorization, scope, account, forwarded_for, smtp_settings]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly
        run: rustup toolchain install "$NIGHTLY" --profile minimal
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-fuzz@0.13.2
      - name: Restore fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz for 45 minutes (AddressSanitizer)
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          cargo +"$NIGHTLY" fuzz run --target "$FUZZ_TARGET_TRIPLE" "$TARGET" "fuzz/corpus/$TARGET" "fuzz/seeds/$TARGET" -- \
            -dict=fuzz/dicts/stuffcloud.dict -max_total_time=2700 -timeout=10 -rss_limit_mb=2048
      # Keep only inputs that add coverage, so the cache stays small and the PR
      # run starts from the essential set.
      - name: Minimise corpus
        env:
          TARGET: ${{ matrix.target }}
        run: cargo +"$NIGHTLY" fuzz cmin --target "$FUZZ_TARGET_TRIPLE" "$TARGET" "fuzz/corpus/$TARGET"
      - name: Save fuzz corpus
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload crash inputs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          retention-days: 90

  # Sharded like the PR job in ci.yml: the app crate's mutants each rebuild it and run its
  # integration tests, which is too much for one runner.
  mutants-full:
    name: mutants-full (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-mutants@27.1.0
      - name: All mutants (one shard)
        env:
          SHARD: ${{ matrix.shard }}
        run: cargo mutants --workspace --no-shuffle -vV --shard "$SHARD/6"
      - name: Upload mutants report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-out-${{ matrix.shard }}
          path: mutants.out
          retention-days: 30

  # The same run as the PR job `mutation-python` in ci.yml (every mutant of scripts/ci/*.py,
  # #161, ADR 0007), every night so that a mutant that only the nightly composition of tests
  # notices, or a timing change, shows up even when no PR touched the helpers. The report is
  # kept as an artifact either way.
  mutation-python:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install mutmut (hash-locked)
        run: python -m pip install --require-hashes --no-deps -r scripts/ci/requirements-mutmut.txt
      # coverage.py (installed with mutmut, configured in pyproject.toml): line and branch coverage
      # of the helpers, so untested branches show before the mutation run starts. The floor in
      # pyproject.toml is what the tests reach today.
      - name: Coverage of the helpers
        run: |
          set -euo pipefail
          python -m coverage run -m unittest discover -s scripts/ci -p "test_*.py"
          python -m coverage report
      - name: Mutation run
        run: mutmut run
      - name: Survivors
        run: |
          set -euo pipefail
          mutmut export-cicd-stats
          mutmut results | tee mutants/results.txt
          grep -E ': (survived|no tests|suspicious)$' mutants/results.txt | sed -E 's/^ +//; s/: [a-z ]+$//' > mutants/survivors.txt || true
          while read -r name; do
            mutmut show "$name"
          done < mutants/survivors.txt | tee mutants/survivors-diff.txt
      - name: Gate
        run: python3 scripts/ci/mutation_gate.py
      - name: Upload mutmut report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutmut-report
          path: |
            mutants/mutmut-cicd-stats.json
            mutants/results.txt
            mutants/survivors.txt
            mutants/survivors-diff.txt
            mutants/scripts/ci/*.meta
          if-no-files-found: ignore
          retention-days: 30

  # The full run of the same mutation testing as the PR job `web-mutants` in ci.yml (every mutant of
  # every scoped file of web/apps/web and web/packages/tools, #162, ADR 0007), sharded by file size
  # (`STRYKER_SHARD`, web/stryker.shared.mjs) like `mutants-full`. It finds what the PR job cannot:
  # a changed test or a shared helper that lets a mutant of an untouched file live. The HTML and
  # JSON reports are kept as artifacts either way.
  #
  # Not scheduled yet: surviving mutants that are not closed (progress list in #162) would make
  # every night red, and a job that is allowed to fail would weaken the check (CLAUDE.md), so until
  # the last one is gone the job runs on demand only (`workflow_dispatch`, which also measures the
  # runtime). The commit that kills the last survivor removes the `if:` line below.
  web-mutants-full:
    name: web-mutants-full (${{ matrix.package }} ${{ matrix.shard }})
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # A shard of the tools took 2.3 to more than 3.5 hours on sixteen local workers (the end of a run is slow);
    # one eighth of the scope on a hosted runner may need as much (a job may run six hours at most).
    timeout-minutes: 330
    defaults:
      run:
        working-directory: web
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: packages/tools, shard: '0/1', report: tools-0 }
          - { package: apps/web, shard: '0/8', report: web-0 }
          - { package: apps/web, shard: '1/8', report: web-1 }
          - { package: apps/web, shard: '2/8', report: web-2 }
          - { package: apps/web, shard: '3/8', report: web-3 }
          - { package: apps/web, shard: '4/8', report: web-4 }
          - { package: apps/web, shard: '5/8', report: web-5 }
          - { package: apps/web, shard: '6/8', report: web-6 }
          - { package: apps/web, shard: '7/8', report: web-7 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false
      - name: Enable pnpm (corepack, version from packageManager)
        run: corepack enable
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Mutation run (one shard)
        working-directory: web/${{ matrix.package }}
        env:
          STRYKER_SHARD: ${{ matrix.shard }}
        run: pnpm exec stryker run
      - name: Upload the mutation report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stryker-report-${{ matrix.report }}
          path: |
            web/${{ matrix.package }}/reports/mutation/mutation.html
            web/${{ matrix.package }}/reports/mutation/mutation.json
          if-no-files-found: ignore
          retention-days: 30

  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly with Miri
        run: rustup toolchain install "$NIGHTLY" --profile minimal --component miri,rust-src
      # Isolation off only so proptest can read its config; few cases, because
      # Miri interprets every instruction. Only `core`: `db` and `app` call into C (SQLite)
      # and the operating system (sockets, processes), which Miri cannot interpret; they
      # contain no unsafe code of their own (`unsafe_code = "forbid"`).
      - name: Miri
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-strict-provenance
          PROPTEST_CASES: '16'
        run: cargo +"$NIGHTLY" miri test -p stuffcloud-core --all-features --locked

  proptest-deep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - name: Property tests, 500 000 cases each
        env:
          PROPTEST_CASES: '500000'
        run: cargo test --workspace --all-features --locked --release --test properties --test api_properties

  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-deny@0.20.2
      - name: Fresh RustSec advisories (workspace and fuzz)
        run: |
          cargo deny --locked --config deny.toml check advisories
          cargo deny --locked --manifest-path fuzz/Cargo.toml --config deny.toml check advisories

  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install beta
        run: rustup toolchain install beta --profile minimal --component clippy
      - name: Tests and lints on beta
        run: |
          cargo +beta test --workspace --all-targets --all-features --locked
          cargo +beta clippy --workspace --all-targets --all-features --locked -- -D warnings
