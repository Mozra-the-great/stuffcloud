# cargo-deny: supply-chain gate for every Rust dependency (CI job `supply-chain`,
# plus a nightly advisories run, because a new advisory needs no code change).
# Checked for the main workspace and, in CI, for fuzz/ as well.

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the build: vulnerabilities, unsound code,
# unmaintained crates (direct and transitive) and yanked versions. An exception
# goes into `ignore` with the advisory id and a reason, never as a blanket switch.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
# GPL-3.0-or-later project (docs/SPEC.md, section 3): only licenses compatible
# with it, and only those in use or expected for the planned stack. A new one is
# added here deliberately, after the check the spec asks for.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
# libFuzzer (LLVM, NCSA): GPL-compatible, only in the fuzz workspace, never shipped.
exceptions = [{ allow = ["NCSA"], crate = "libfuzzer-sys" }]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
# `*` version requirements make builds depend on whatever is newest.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
# crates.io only: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
