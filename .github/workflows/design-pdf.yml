name: Rebuild design PDF

# Rebuilds docs/design/stuffcloud-design-system.pdf on a branch without a local
# Chrome. Run it from the Actions tab (or `gh workflow run design-pdf.yml -f branch=<name>`)
# when the `build` check says the PDF is stale.
#
# The run commits the PDF and docs/design/pdf-source.sha256 to the branch. Pushes made
# with the workflow token do not start other workflows, so the run dispatches the
# workflows behind the required checks `build`, `workflow-lint` and `gitleaks` for the
# new commit. `claude-review` only runs for pull_request events and cannot be
# dispatched; it starts with your next push (for example an empty commit:
# `git commit --allow-empty -m "chore: rerun checks"`). Pushing with a deploy key
# instead would start every workflow, but that needs a repository secret.
# Never runs on main: main only receives the PDF through a reviewed PR.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to rebuild the PDF on (not main)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: design-pdf-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    env:
      BRANCH: ${{ inputs.branch }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Refuse main
        run: |
          if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ]; then
            echo "::error::Run this on a feature branch; main only gets the PDF through a PR."
            exit 1
          fi

      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install -r docs/design/tools/pdf/requirements.txt

      # google-chrome is preinstalled on ubuntu-latest; chrome.py finds it.
      - name: Build the PDF
        run: python docs/design/tools/pdf/build.py

      - name: Commit and push the result
        run: |
          if git diff --quiet -- docs/design/stuffcloud-design-system.pdf docs/design/pdf-source.sha256 \
             && [ -z "$(git ls-files --others --exclude-standard docs/design)" ]; then
            echo "PDF already current, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design/stuffcloud-design-system.pdf docs/design/pdf-source.sha256
          git commit -m "chore: rebuild the design PDF"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"
          for wf in ci.yml workflow-lint.yml secret-scan.yml; do
            gh workflow run "$wf" --repo "$REPO" --ref "$BRANCH"
          done
