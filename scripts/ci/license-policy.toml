# License policy for the npm dependencies of web/ (CI job `licenses`,
# scripts/ci/license_gate.py). docs/SPEC.md, section 3: the project is
# GPL-3.0-or-later, so a dependency may only use a GPLv3-compatible license.
#
# `allow` is the same list as `[licenses].allow` in deny.toml (the Rust gate);
# test_license_policy.py fails when the two differ. Add a license to both files in
# the same PR, after checking that it is GPLv3-compatible. It applies to prod and
# dev dependencies alike. `X WITH Y` is listed as written there and never matches
# the bare `X`.
#
# Not listed on purpose (a package using one fails until it is decided here):
# GPL-3.0-only / AGPL-3.0 (they would bind the combined work to -only, SPEC 3 asks
# for a per-case check), LGPL (same), CC-BY-*, proprietary and unlicensed code.
allow = [
    # 0BSD: Zero-Clause BSD, permissive, GPL-3.0-compatible; runtime via tslib (pdf-lib)
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

# Licenses accepted only for packages that are in no production dependency tree
# (never shipped to users, never part of the build output). Each needs a reason.
[dev_only]
"BlueOak-1.0.0" = "Permissive license (Blue Oak Council, rated gold) with MIT-like terms and no copyleft, so GPLv3 compatible, but not on the FSF list and not in deny.toml; used by lru-cache and minimatch inside ESLint. Dev tooling only."
"Python-2.0" = "PSF license of the `argparse` 2.0.1 port (a dependency of ESLint); permissive, the PSF 2.0.1 terms are GPL-compatible per the FSF. Dev tooling only."
"CC-BY-4.0" = "Creative Commons Attribution 4.0 (a free licence, one-way compatible with GPLv3 per the FSF) of the browser-support data package `caniuse-lite`, which StrykerJS (mutation testing, dev tooling) pulls in through browserslist and Babel. It is data, in no production dependency tree and not part of the build output."

# Packages whose declared license is not a valid SPDX expression, one entry per
# package and exact license text (it stops matching when the package changes the
# text). Format:
#
# [[exception]]
# name = "some-package"
# license = "SEE LICENSE IN LICENSE.md"
# reason = "Checked LICENSE.md in version X: it is MIT."
