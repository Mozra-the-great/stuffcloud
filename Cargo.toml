# stuffcloud Rust workspace (docs/SPEC.md, section 4).
#
# crates/core: domain types and validation without I/O; crates/db: SQLite (WAL), migrations
# and the resource store; crates/app: the LAN API (axum). edge (public endpoints) and cli
# join them in phases 3 and later.
# fuzz/ is a separate workspace because cargo-fuzz needs a nightly toolchain.

[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Same as rust-toolchain.toml: CI builds with exactly this release.
rust-version = "1.97"
license = "GPL-3.0-or-later"
repository = "https://github.com/Mozra-the-great/stuffcloud"
publish = false

[workspace.dependencies]
stuffcloud-core = { path = "crates/core" }
stuffcloud-db = { path = "crates/db" }
unicode-normalization = "0.1.24"
proptest = "1.12.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "tokio", "tower-log"] }
prometheus-client = "0.26.0"
# SQLite is compiled in (static, so the distroless image needs no libsqlite3).
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.1", default-features = false, features = ["catch-panic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "std"] }
utoipa = "6.0.0"

# Lints apply to every crate (`[lints] workspace = true`). They are warnings here so
# local work is not blocked; CI turns every warning into an error.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_results = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# No panics on input in library code: errors are values. Tests may unwrap
# (clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
string_slice = "warn"
arithmetic_side_effects = "warn"
as_conversions = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
# Integer overflow is a bug, not a wrap-around, in release builds too.
overflow-checks = true
lto = "thin"
codegen-units = 1
