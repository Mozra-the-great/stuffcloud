<div class="frame">
<header class="hdr"><div class="hdr-l"><a class="brand" href="#"><img src="logo.svg" alt=""><span>stuffcloud</span></a><nav class="nav" aria-label="Main"><a href="#">Tools</a><a href="#">Hosting</a><a href="#">Docs</a></nav></div><div class="hdr-r"><a href="#">Log in</a></div><button class="menu-btn" type="button" aria-label="Open menu"><svg width="20" height="14" viewBox="0 0 20 14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M0 1h20M0 7h20M0 13h20"/></svg></button></header>

<span class="mono mut" style="font-size:12px">12 characters or more</span></div>
<button class="btn" type="submit">Create account</button>
</form>
<p style="margin:0;font-size:15px;color:#c7c7cf">Already have an account? <a class="link" href="#" style="display:inline-flex;align-items:center;min-height:44px">Log in</a></p>
</main>
