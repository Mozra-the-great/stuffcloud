# Local development stack: `docker compose -f compose.dev.yml up --build`
# (or `export COMPOSE_FILE=compose.dev.yml` once per shell). How to use it, the zones, how to
# reset the data and the manual checks: README, section "Local development stack".
#
# Services
#   caddy    reverse proxy and static web server: the web app on the app address with the index
#            fallback for deep links, a placeholder site on every name below the site base, the
#            Mailpit UI; two listeners (docker/caddy/Caddyfile.dev, ADR 0009)
#   app      the LAN API (crates/app, docker/app/Dockerfile): `/api/*` on the app address goes
#            here; not published on the host, Caddy is the only way in. Its database lives in
#            the named volume `app-data`; on the first start it applies
#            docker/app/bootstrap.dev.json once (SPEC 10.7). It trusts the `X-Forwarded-For` of
#            the stack network (STUFFCLOUD_TRUSTED_PROXIES), so the login throttles see each
#            client behind Caddy instead of one shared address (#146)
#   mailpit  mail catcher: SMTP on 1025, UI through Caddy. The app sends its mail (the password
#            reset mail, A-10) to `mailpit:1025`: the `smtp` group of docker/app/bootstrap.dev.json
#   Later: `edge` (H-19, #104) joins with its Dockerfile.
#
# Every service is hardened the same way and CI enforces it for every service in this file
# and every Dockerfile in the repository (scripts/ci/check_container_hardening.py):
#   - an unprivileged numeric user, read-only root filesystem, `cap_drop: ALL`, no added
#     capabilities, `no-new-privileges`
#   - a health check, images pinned by tag and digest (built images: in their Dockerfile)
#   - published ports bound to the loopback address only (published ports bypass host
#     firewall INPUT rules), bind mounts read-only, only tmpfs or named volumes writable
# A new service copies the `x-hardened` anchor below; CI fails when one part is missing.
#
# Variables: `.env.example` documents them, all have defaults; a `.env` file is optional and
# git-ignored. Only RFC 6761 / RFC 2606 names (`*.localhost`) appear here.

name: stuffcloud-dev

x-hardened: &hardened
  user: "65532:65532"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  caddy:
    <<: *hardened
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
    image: stuffcloud-dev-caddy:local
    environment:
      STUFFCLOUD_APP_HOST: ${STUFFCLOUD_APP_HOST:-stuff.localhost}
      STUFFCLOUD_SITES_BASE: ${STUFFCLOUD_SITES_BASE:-sites.localhost}
      STUFFCLOUD_MAIL_HOST: ${STUFFCLOUD_MAIL_HOST:-mail.localhost}
    ports:
      # LAN listener. The tunnel listener (8090) is deliberately not published.
      - target: 8080
        published: "${STUFFCLOUD_HTTP_PORT:-8080}"
        host_ip: ${STUFFCLOUD_BIND:-127.0.0.1}
        protocol: tcp
    volumes:
      - type: bind
        source: ./docker/caddy/Caddyfile.dev
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: bind
        source: ./docker/caddy/sites
        target: /srv/sites
        read_only: true
    tmpfs:
      # Caddy's storage and config directories; nothing in this stack needs them to persist.
      - /data
      - /config
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      app:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  app:
    <<: *hardened
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: stuffcloud-dev-app:local
    environment:
      STUFFCLOUD_APP_URL: http://${STUFFCLOUD_APP_HOST:-stuff.localhost}:${STUFFCLOUD_HTTP_PORT:-8080}
      STUFFCLOUD_LISTEN: 0.0.0.0:8000
      STUFFCLOUD_DATA_DIR: /data
      STUFFCLOUD_LOG_FORMAT: text
      STUFFCLOUD_BOOTSTRAP_CONFIG: /etc/stuffcloud/bootstrap.json
      # Caddy reaches the app from the stack network below; every deployment behind a reverse
      # proxy sets this to the proxy's address or network (README, "Reverse proxy").
      STUFFCLOUD_TRUSTED_PROXIES: 198.51.100.0/24
    volumes:
      # The only writable path: the database (reset with `docker compose down --volumes`).
      - type: volume
        source: app-data
        target: /data
      - type: bind
        source: ./docker/app/bootstrap.dev.json
        target: /etc/stuffcloud/bootstrap.json
        read_only: true
    healthcheck:
      # distroless has no shell or curl: the binary probes GET /readyz itself.
      test: ["CMD", "/usr/local/bin/stuffcloud-app", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mailpit:
    <<: *hardened
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    environment:
      # The message store lives on the tmpfs below and is gone with the container.
      MP_DATABASE: /tmp/mailpit.db
      MP_MAX_MESSAGES: "500"
      MP_DISABLE_VERSION_CHECK: "true"
    ports:
      - target: 1025
        published: "${STUFFCLOUD_SMTP_PORT:-1025}"
        host_ip: ${STUFFCLOUD_BIND:-127.0.0.1}
        protocol: tcp
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

# A fixed subnet, so STUFFCLOUD_TRUSTED_PROXIES of `app` can name it. It is a documentation
# range (RFC 5737): it never collides with a real network on the host, and outbound traffic is
# masqueraded like on any bridge. Change both places together if it ever has to move.
networks:
  default:
    ipam:
      config:
        - subnet: 198.51.100.0/24

volumes:
  app-data:
