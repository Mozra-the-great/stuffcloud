</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="pw" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 1px; color: #a2a2ab">PASSWORD</label>
<div style="display: flex; gap: 8px">
<input id="pw" type="password" autocomplete="current-password" style="flex: 1; min-width: 0; box-sizing: border-box; min-height: 52px; background: transparent; border: 1px solid #3a3a42; color: #f4f4f0; padding: 0 14px; font-family: 'JetBrains Mono', monospace; font-size: 16px">

</div>
<a class="link" href="#" style="font-size: 14px; display: inline-flex; align-items: center; min-height: 44px">Forgot password?</a>
</div>
<button type="submit" style="min-height: 56px; background: #f4f4f0; color: #101012; border: 0; font-weight: 600; font-size: 16px; cursor: pointer">Log in</button>
</form>

<p style="margin: 0; font-size: 15px; color: #c7c7cf">No account? <a class="link" href="#" style="display: inline-flex; align-items: center; min-height: 44px">Create one</a></p>
</main>
