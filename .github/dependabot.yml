version: 2

# Dependabot keeps the SHA-pinned actions in .github/workflows fresh (convention C5),
# the Rust and npm dependencies, and, once you uncomment a block below, the rest of
# your stack. The docker ecosystems joined with the dev stack (#7).
#
# cooldown (zizmor audit dependabot-cooldown): a new release is proposed only after
# 7 days. If a package is compromised that is usually noticed within that window;
# without the wait the bad version would sit in a PR immediately. Every ecosystem
# needs its own cooldown entry, so copy it into each block you enable.
#
# Cost: Dependabot runs as GitHub Actions jobs - free in a public repo, billed
# against the Actions minutes in a private one (see docs/TEMPLATE-SETUP.md, D1).
# Dependabot cannot read repository secrets, so Claude jobs skip its PRs
# (`github.actor != 'dependabot[bot]'`). Merge its PRs only after `build` ran on them.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(actions)"

  # Rust: the main workspace and the separate fuzz workspace (own Cargo.lock).
  # cargo-deny runs on every Dependabot PR like on any other (job supply-chain).
  # rust-toolchain.toml and the pinned nightly are bumped by hand.
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/fuzz"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  # Node: the Svelte frontend (web/), a pnpm workspace with one lockfile at its root;
  # Dependabot reads pnpm-lock.yaml and updates every workspace package from there.
  # Minor and patch updates arrive as one grouped PR; majors stay separate PRs.
  # The frontend job `web` of `build` and the CodeQL run check every Dependabot PR.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    # @types/node describes the Node API of the runtime we pin (engines ">=24 <25" in
    # web/package.json, .nvmrc). A new major describes an API this code never runs
    # on, so keep it in line with the Node major in .nvmrc: bump it by hand together
    # with the Node version. Minor and patch updates still arrive.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Container images of the dev stack (compose.dev.yml, docker/caddy/Dockerfile). Every
  # reference is `name:tag@sha256:digest` (scripts/ci/check_container_hardening.py); Dependabot
  # updates tag and digest together. No automatic major bumps for container images (C9): a
  # major jump belongs in a hand-prepared PR. The Node image follows the Node major in
  # `web/.nvmrc`, so it is bumped by hand together with it. Each new Dockerfile directory
  # (`app`, `edge`) gets an entry here.
  - package-ecosystem: "docker"
    directory: "/docker/caddy"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The `app` image (docker/app/Dockerfile). The Rust build image follows rust-toolchain.toml
  # (a test in crates/app fails otherwise), so only its digest is updated here; its version is
  # bumped by hand together with the toolchain.
  - package-ecosystem: "docker"
    directory: "/docker/app"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rust"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

  # compose.dev.yml images (one PR per image, so a failure maps to one update)
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(stacks)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
