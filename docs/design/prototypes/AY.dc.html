<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>stuffcloud recovery code</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="stuff.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</helmet>
<div class="frame">
<header class="hdr"><div class="hdr-l"><a class="brand" href="#"><img src="logo.svg" alt=""><span>stuffcloud</span></a><nav class="nav" aria-label="Main"><a href="#">Tools</a><a href="#">Hosting</a><a href="#">Docs</a></nav></div><div class="hdr-r"><a href="#">Log in</a></div><button class="menu-btn" type="button" aria-label="Open menu"><svg width="20" height="14" viewBox="0 0 20 14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M0 1h20M0 7h20M0 13h20"/></svg></button></header>
<div class="split">
<form class="main narrow" onSubmit="{{noop}}" style="margin:0">
<div class="stack-s"><p class="eyebrow">account / two-factor / recovery</p><h1 class="title">Use a recovery code</h1></div>
<div role="alert" style="border:1px solid var(--pink2);background:#2a0f1a;padding:14px 16px;display:flex;gap:12px;align-items:center"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="var(--pink)" stroke-width="2" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M8 4.5v4M8 11v.5"/></svg><span style="font-size:15px">That code is not valid. 2 attempts left.</span></div>
<div class="fld"><label class="label" for="rc">Recovery code</label><input class="field" id="rc" type="text" autocomplete="off" spellcheck="false" placeholder="xxxx-xxxx" aria-invalid="true" aria-describedby="err" value="k3f9-2mxb" style="min-height:64px;font-size:24px;border-color:var(--pink2)"><span class="mono" id="err" style="font-size:12px;color:var(--pink)">Each code works once.</span></div>
<button class="btn" type="submit">Verify</button>
<div style="display:flex;flex-direction:column;border-top:1px solid var(--line)"><a class="link" href="#" style="display:flex;align-items:center;min-height:52px;font-size:15px;border-bottom:1px solid var(--line)">Use the authenticator app instead</a><a class="link" href="#" style="display:flex;align-items:center;min-height:52px;font-size:15px">Back to log in</a></div>
</form>
<aside class="panel" style="flex:1 1 480px;border-left:1px solid var(--line);--mh:560px;--mhm:200px"><div class="b1"></div><div class="b2"></div><div class="b3"></div><img class="st" src="lock.svg" alt="" style="left:80px;top:180px;width:72px;transform:rotate(-8deg)"><img class="st hide-m" src="dice.svg" alt="" style="right:90px;top:200px;width:56px;transform:rotate(10deg)"><img class="axo bob" src="axo.svg" alt="Stuffy, the stuffcloud mascot"></aside>
</div>
<footer class="foot"><div>stuffcloud · GPL-3.0 · no trackers</div><span><a href="#">Source</a><a href="#">Privacy</a><a href="#">Report abuse</a></span></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return { noop: (e) => { if (e && e.preventDefault) e.preventDefault(); } };
}
}
</script>
</body>
</html>
