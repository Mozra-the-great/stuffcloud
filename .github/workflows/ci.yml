name: CI

# Every PR and every push to main runs the whole suite below. `build` is the
# required status check (ruleset): it is an aggregate that only turns green when
# every other job in this workflow succeeded, so new jobs can be added without
# touching the ruleset. Keep the job id `build`.
#
# No workflow-level `paths:` filter (convention C1): a required check whose
# workflow does not start is reported as pending forever, not as skipped.
#
# Test philosophy (docs/SPEC.md, section 14): deliberately more than needed. Every
# PR gets lint, unit, property, regression and doc tests, a coverage floor,
# mutation testing of the changed code, a short fuzz run per target and the
# supply-chain gate. The long runs (fuzzing for an hour, full mutation run, Miri,
# fresh advisories) are in deep-tests.yml. The Svelte frontend (web/) has the job
# `web` (lint, typecheck, unit tests with the coverage floor, production build) and
# the job `e2e` (Playwright in Chromium and Firefox against the built app, T-06, with the axe
# accessibility gate, T-05: any WCAG A/AA or best-practice violation fails it). `openapi` fails
# when the committed OpenAPI document or the generated TypeScript client no longer matches the
# handlers. Every new job goes into `needs` of `build`.
#
# Jobs never skip themselves on changed paths: the aggregate treats a skipped job
# as a failure, so a frontend job that is skipped on a Rust-only PR would turn
# `build` red. Both stacks run on every PR; they are cheap compared to the Rust
# jobs and run in parallel with them.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Nightly for cargo-fuzz only (sanitizers need it). Pinned so a nightly
  # regression cannot turn a PR red; bump together with deep-tests.yml.
  NIGHTLY: nightly-2026-11-01
  # Explicit fuzz target: the prebuilt cargo-fuzz from install-action is a musl
  # binary and would otherwise default to x86_64-unknown-linux-musl, where
  # AddressSanitizer cannot link (statically linked libc).
  FUZZ_TARGET_TRIPLE: x86_64-unknown-linux-gnu

jobs:
  # ── Repository checks (stack-independent) ──────────────────────────────────
  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Labels-as-code tests (opt-in set, see .github/labels.json). Runs only while
      # the set is present. Standard library only: the runner's python3 is enough.
      - name: Test label script
        if: ${{ hashFiles('scripts/ci/test_labels.py') != '' }}
        run: python3 -m unittest discover -s scripts/ci -p "test_*.py"

      # Cookie scope gate (SPEC 5.5, ADR 0009): no Rust source of any crate may set a
      # cookie with a Domain attribute, and only the cookie module names Set-Cookie. The
      # runtime counterpart is the integration test that checks every Set-Cookie of every
      # route (crates/app/tests/integration/auth.rs).
      - name: No cookie with a Domain attribute
        run: python3 scripts/ci/check_cookies.py

      # The hash of the design sources must match docs/design/pdf-source.sha256,
      # which build.py writes with the PDF. Fails when docs/design changed without
      # a PDF rebuild.
      - name: Design PDF is current
        if: ${{ hashFiles('docs/design/tools/pdf/source_hash.py') != '' }}
        run: python3 docs/design/tools/pdf/source_hash.py --check

  # ── Rust: formatting ───────────────────────────────────────────────────────
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - name: rustfmt (workspace and fuzz targets)
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path fuzz/Cargo.toml --all --check

  # ── Rust: lints, every warning is an error ─────────────────────────────────
  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The lint set lives in Cargo.toml ([workspace.lints]): pedantic, no unwrap,
      # no indexing, no unchecked arithmetic, unsafe forbidden.
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # ── Rust: unit, property, regression and doc tests ─────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # --locked everywhere: a Cargo.lock that does not match Cargo.toml fails.
      - name: Tests (debug)
        env:
          PROPTEST_CASES: '4096'
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Doc tests
        run: cargo test --workspace --doc --locked
      # Release profile too: other optimisations, same overflow checks.
      - name: Tests (release)
        env:
          PROPTEST_CASES: '4096'
        run: cargo test --workspace --all-targets --all-features --locked --release

  # ── Rust: API docs build without broken links or warnings ──────────────────
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items --locked

  # ── Rust: coverage floor ────────────────────────────────────────────────────
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml) and llvm-tools
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # 95 % of lines and regions. Raising it is fine; lowering it needs a reason
      # in the PR. Code that cannot be reached by tests is a design smell here.
      - name: Coverage (fails below 95 %)
        run: |
          cargo llvm-cov --workspace --all-targets --all-features --locked \
            --fail-under-lines 95 --fail-under-regions 95 \
            --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only
      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: ignore
          retention-days: 14

  # ── Rust: mutation testing ──────────────────────────────────────────────────
  # Changes the code (flips comparisons, replaces return values, deletes match
  # arms) and expects at least one test to fail for every change. A surviving
  # mutant is a line the tests do not really check. PRs test the mutants in the
  # changed lines; pushes to main and the nightly run test all of them.
  # Sharded: every mutant of the app crate rebuilds it and runs its integration tests
  # (router, sockets, the binary as a process), which is too much for one runner. Each
  # shard tests every 6th mutant; together they cover all of them.
  mutants:
    name: mutants (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-mutants@27.1.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Mutants in the PR diff
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
          SHARD: ${{ matrix.shard }}
        run: |
          git diff "origin/${BASE_REF}...HEAD" > pr.diff
          cargo mutants --workspace --in-diff pr.diff --no-shuffle -vV --shard "$SHARD/6"
      - name: All mutants
        if: ${{ github.event_name != 'pull_request' }}
        env:
          SHARD: ${{ matrix.shard }}
        run: cargo mutants --workspace --no-shuffle -vV --shard "$SHARD/6"
      - name: Upload mutants report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-out-${{ matrix.shard }}
          path: mutants.out
          retention-days: 14

  # ── Rust: short fuzz run per target ─────────────────────────────────────────
  # Starts from the committed seeds plus the corpus the nightly run has grown
  # (read-only here), with AddressSanitizer. Two minutes per target catches
  # regressions in what the corpus already reaches; depth comes from the nightly.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [safe_rel_path, subdomain, entity_tags, write_query, writable_body, cookie_header, origin, csrf_check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly
        run: rustup toolchain install "$NIGHTLY" --profile minimal
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Restore fuzz corpus from the nightly run
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.sha }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Lockfile is current
        run: cargo +"$NIGHTLY" fetch --locked --manifest-path fuzz/Cargo.toml
      - name: Fuzz for 2 minutes
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          cargo +"$NIGHTLY" fuzz run --target "$FUZZ_TARGET_TRIPLE" "$TARGET" "fuzz/corpus/$TARGET" "fuzz/seeds/$TARGET" -- \
            -dict=fuzz/dicts/stuffcloud.dict -max_total_time=120 -timeout=10 -rss_limit_mb=2048
      - name: Upload crash inputs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          retention-days: 30

  # ── Frontend (web/): lint, types, tests with coverage floor, build ─────────
  # One matrix entry per check, so a red check is named in the PR (`web (lint)`)
  # and the four run in parallel. pnpm comes from corepack (the `packageManager`
  # field in web/package.json is the single pin), the lockfile is frozen and the
  # pnpm store is cached. Node follows web/.nvmrc.
  web:
    name: web (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    strategy:
      fail-fast: false
      matrix:
        # lint: ESLint (type-aware, no `any`) + Prettier; typecheck: tsc +
        # svelte-check; test: Vitest, 95 % coverage floor per package; build: Vite
        # production build + package emit.
        check: [lint, typecheck, test, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false
      - name: Enable pnpm (corepack, version from packageManager)
        run: corepack enable
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      # --frozen-lockfile: a pnpm-lock.yaml that does not match package.json fails.
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: pnpm ${{ matrix.check }}
        env:
          CHECK: ${{ matrix.check }}
        run: pnpm "$CHECK"
      - name: Upload coverage reports
        if: ${{ always() && matrix.check == 'test' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-coverage-lcov
          path: web/**/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  # ── Frontend (web/): end-to-end tests in real browsers ─────────────────────
  # Playwright runs against the built app (`vite build` + `vite preview`, never the dev
  # server) in Chromium and Firefox: the app shell, the tool registry, the worker pool, and the
  # privacy test (no tool sends file content, SPEC 14). The build is the production app plus
  # the test-only tools of web/apps/web/e2e/app/tools. The accessibility gate (T-05, axe on every
  # state, keyboard walk, reduced motion) runs here too, docs/ACCESSIBILITY.md. No retries: a flaky
  # test stays red.
  # The HTML report and the smoke screenshots are uploaded for every run.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false
      - name: Enable pnpm (corepack, version from packageManager)
        run: corepack enable
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # The browser build follows the Playwright version, which the lockfile pins.
      - name: Cache the Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: Install the browsers and their system libraries
        if: ${{ steps.browsers.outputs.cache-hit != 'true' }}
        run: pnpm --filter @stuffcloud/web exec playwright install --with-deps chromium firefox
      - name: Install the system libraries of the cached browsers
        if: ${{ steps.browsers.outputs.cache-hit == 'true' }}
        run: pnpm --filter @stuffcloud/web exec playwright install-deps chromium firefox
      - name: Build the app for the end-to-end run
        run: pnpm --filter @stuffcloud/web e2e:build
      - name: Playwright (Chromium and Firefox)
        run: pnpm --filter @stuffcloud/web e2e
      - name: Upload the report and the screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/apps/web/playwright-report
            web/apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14

  # ── OpenAPI drift: the document and the TypeScript client follow the handlers ──
  # Regenerates the OpenAPI document from the handlers of `app` (utoipa) and the typed client
  # of web/packages/api-client from it (openapi-typescript), and fails when either differs
  # from the committed file (SPEC 10.1). On a failure both regenerated files are uploaded, so
  # they can be committed as they are. The breaking-change check against the last release
  # joins once a release contains the API (ADR 0010 decision 11).
  openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false
      - name: Enable pnpm (corepack, version from packageManager)
        run: corepack enable
      - name: Install web dependencies (frozen lockfile)
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Regenerate the OpenAPI document
        run: |
          mkdir -p "$RUNNER_TEMP/openapi"
          cargo run --locked -q -p stuffcloud-app -- openapi > "$RUNNER_TEMP/openapi/openapi.json"
      - name: docs/api/openapi.json is current
        run: diff -u docs/api/openapi.json "$RUNNER_TEMP/openapi/openapi.json"
      - name: The TypeScript client is current
        working-directory: web
        run: pnpm --filter @stuffcloud/api-client generate -- --input "$RUNNER_TEMP/openapi/openapi.json" --check
      - name: Regenerate the client for the upload
        if: ${{ failure() }}
        working-directory: web
        run: |
          pnpm --filter @stuffcloud/api-client generate -- --input "$RUNNER_TEMP/openapi/openapi.json"
          cp packages/api-client/src/generated/schema.d.ts "$RUNNER_TEMP/openapi/"
      - name: Upload the regenerated files
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi-regenerated
          path: ${{ runner.temp }}/openapi
          retention-days: 14

  # ── Licenses: npm gate and the THIRD-PARTY.md report ───────────────────────
  # The npm counterpart of `supply-chain` (cargo-deny): every package of the web/
  # workspace, production and dev, including the native packages of other
  # platforms, must have a license from scripts/ci/license-policy.toml (the same
  # list as deny.toml, docs/SPEC.md section 3). docs/THIRD-PARTY.md must match the
  # lockfiles (regenerate with `python3 scripts/ci/third_party.py --write`). The
  # inventory installs into a scratch directory with --ignore-scripts, so no
  # dependency code runs here. The tool tests also run in `repo-checks`; they are
  # repeated here because this job needs them to mean anything.
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false
      - name: Enable pnpm (corepack, version from packageManager)
        run: corepack enable
      # cargo metadata (THIRD-PARTY.md, Rust part) needs the pinned toolchain.
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - name: Locate the pnpm store
        id: pnpm-store
        working-directory: web
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-licenses-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-licenses-${{ runner.os }}-
      - name: Tests of the license tooling
        run: python3 -m unittest discover -s scripts/ci -p "test_*.py"
      - name: npm license gate
        run: python3 scripts/ci/license_gate.py
      - name: THIRD-PARTY.md is current
        run: python3 scripts/ci/third_party.py --check

  # ── Dev stack (compose.dev.yml): hardening gate, Caddyfile, smoke test ─────────────────────
  # Static: every compose file and Dockerfile in the repository, found by pattern, must pass
  # scripts/ci/check_container_hardening.py (unprivileged user, read-only root, cap_drop ALL,
  # no-new-privileges, health check, images pinned by digest, loopback-only ports), so a new
  # service or image is covered without touching this job. Then the stack is built and started,
  # the hardening is asserted again on the running containers, and a smoke test drives it
  # (web app with index fallback, placeholder site, cookie isolation, tunnel listener, Mailpit).
  dev-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_FILE: compose.dev.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests of the hardening gate
        run: python3 -m unittest -v test_container_hardening
        working-directory: scripts/ci
      - name: Hardening gate (compose files, Dockerfiles, .env.example)
        run: python3 scripts/ci/check_container_hardening.py static
      - name: Build the images
        run: docker compose build
      - name: Caddyfile is valid and formatted
        run: |
          docker compose run --rm --no-deps --entrypoint caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker compose run --rm --no-deps --entrypoint caddy caddy fmt --diff /etc/caddy/Caddyfile
      - name: Start the stack
        run: docker compose up --wait --wait-timeout 180
      - name: Hardening gate (running containers)
        run: python3 scripts/ci/check_container_hardening.py runtime
      - name: Smoke test
        run: python3 scripts/ci/dev_stack_smoke.py
      # Memory/CPU baseline of the running containers after the smoke test (documented in the
      # README, "Local development stack").
      - name: Resource baseline
        run: docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.PIDs}}'
      - name: Container logs
        if: ${{ failure() }}
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans

  # ── Supply chain: advisories, licenses, sources, bans ──────────────────────
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-deny@0.20.2
      # deny.toml: RustSec advisories (incl. unmaintained, unsound, yanked),
      # GPL-3.0-compatible licenses only, crates.io only, no wildcard versions.
      - name: cargo-deny (workspace)
        run: cargo deny --locked --config deny.toml check
      - name: cargo-deny (fuzz workspace)
        run: cargo deny --locked --manifest-path fuzz/Cargo.toml --config deny.toml check

  # ── CodeQL (security-extended, fails on any finding) ───────────────────────
  # Reusable workflow, so the weekly scheduled run and this one stay identical.
  codeql:
    permissions:
      contents: read
      security-events: write
      actions: read
    # zizmor suggests the newer `$/...` self-repository syntax, but actionlint
    # 1.7.12 (workflow-lint) rejects it; switch once actionlint supports it.
    uses: ./.github/workflows/codeql.yml # zizmor: ignore[self-repository]

  # ── Required check: everything above passed ────────────────────────────────
  build:
    if: ${{ always() }}
    needs: [repo-checks, fmt, clippy, test, docs, coverage, mutants, fuzz, web, e2e, openapi, licenses, dev-stack, supply-chain, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A skipped or cancelled job counts as a failure: green means every job ran.
      - name: All jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
