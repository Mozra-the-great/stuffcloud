name: Rebuild design PDF

# Rebuilds docs/design/stuffcloud-design-system.pdf on a branch without a local
# Chrome. Run it from the Actions tab (or `gh workflow run design-pdf.yml -f branch=<name>`)
# when the `build` check says the PDF is stale.
#
# The run commits the PDF and docs/design/pdf-source.sha256 to the branch. It pushes
# over SSH with the deploy key in the Actions secret DESIGN_PDF_DEPLOY_KEY (a write
# deploy key of this repository): unlike a push with the workflow token, that push
# starts every workflow, so all required checks, claude-review included, report on the
# new commit. Without the secret it falls back to the token: then only the workflows
# behind `build`, `workflow-lint` and `gitleaks` are dispatched and `claude-review`
# needs a follow-up push (`git commit --allow-empty -m "chore: rerun checks"`).
# Never runs on main: main only receives the PDF through a reviewed PR.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to rebuild the PDF on (not main)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: design-pdf-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    env:
      BRANCH: ${{ inputs.branch }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Refuse main
        run: |
          if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ]; then
            echo "::error::Run this on a feature branch; main only gets the PDF through a PR."
            exit 1
          fi

      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install -r docs/design/tools/pdf/requirements.txt

      # google-chrome is preinstalled on ubuntu-latest; chrome.py finds it.
      - name: Build the PDF
        run: python docs/design/tools/pdf/build.py

      - name: Commit and push the result
        env:
          DEPLOY_KEY: ${{ secrets.DESIGN_PDF_DEPLOY_KEY }}
        run: |
          if git diff --quiet -- docs/design/stuffcloud-design-system.pdf docs/design/pdf-source.sha256 \
             && [ -z "$(git ls-files --others --exclude-standard docs/design)" ]; then
            echo "PDF already current, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design/stuffcloud-design-system.pdf docs/design/pdf-source.sha256
          git commit -m "chore: rebuild the design PDF"
          if [ -n "$DEPLOY_KEY" ]; then
            key="$RUNNER_TEMP/design-pdf-key"
            printf '%s\n' "$DEPLOY_KEY" > "$key"
            chmod 600 "$key"
            GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
              git push "git@github.com:${REPO}.git" "HEAD:refs/heads/${BRANCH}"
            rm -f "$key"
          else
            git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"
            for wf in ci.yml workflow-lint.yml secret-scan.yml; do
              gh workflow run "$wf" --repo "$REPO" --ref "$BRANCH"
            done
          fi
