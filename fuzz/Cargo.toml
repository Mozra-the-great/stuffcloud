# Fuzz targets for stuffcloud-core (cargo-fuzz, libFuzzer). A separate workspace:
# cargo-fuzz needs a nightly toolchain, the main workspace stays on stable.
#
#   cargo +nightly-2026-11-01 fuzz run safe_rel_path fuzz/corpus/safe_rel_path \
#       fuzz/seeds/safe_rel_path -- -dict=fuzz/dicts/stuffcloud.dict -max_total_time=60

[package]
name = "stuffcloud-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
serde_json = "1.0.154"
stuffcloud-core = { path = "../crates/core" }

[workspace]
members = ["."]

[[bin]]
name = "safe_rel_path"
path = "fuzz_targets/safe_rel_path.rs"
test = false
doc = false
bench = false

[[bin]]
name = "subdomain"
path = "fuzz_targets/subdomain.rs"
test = false
doc = false
bench = false

[[bin]]
name = "entity_tags"
path = "fuzz_targets/entity_tags.rs"
test = false
doc = false
bench = false

[[bin]]
name = "write_query"
path = "fuzz_targets/write_query.rs"
test = false
doc = false
bench = false

[[bin]]
name = "writable_body"
path = "fuzz_targets/writable_body.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cookie_header"
path = "fuzz_targets/cookie_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "origin"
path = "fuzz_targets/origin.rs"
test = false
doc = false
bench = false

[[bin]]
name = "csrf_check"
path = "fuzz_targets/csrf_check.rs"
test = false
doc = false
bench = false

[[bin]]
name = "authorization"
path = "fuzz_targets/authorization.rs"
test = false
doc = false
bench = false
