# stuffcloud Rust workspace (docs/SPEC.md, section 4).
#
# crates/core is the only member so far: domain types and validation without I/O.
# app (LAN API), edge (public endpoints), db and cli join it in phases 2 and 3.
# fuzz/ is a separate workspace because cargo-fuzz needs a nightly toolchain.

[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Same as rust-toolchain.toml: CI builds with exactly this release.
rust-version = "1.97"
license = "GPL-3.0-or-later"
repository = "https://github.com/Mozra-the-great/stuffcloud"
publish = false

[workspace.dependencies]
stuffcloud-core = { path = "crates/core" }
unicode-normalization = "0.1.24"
proptest = "1.12.0"

# Lints apply to every crate (`[lints] workspace = true`). They are warnings here so
# local work is not blocked; CI turns every warning into an error.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_results = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# No panics on input in library code: errors are values. Tests may unwrap
# (clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
string_slice = "warn"
arithmetic_side_effects = "warn"
as_conversions = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
# Integer overflow is a bug, not a wrap-around, in release builds too.
overflow-checks = true
lto = "thin"
codegen-units = 1
