<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>stuffcloud report abuse</title>

<link rel="stylesheet" href="stuff.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</helmet>
<div class="frame">
<header class="hdr"><div class="hdr-l"><a class="brand" href="#"><img src="logo.svg" alt=""><span>stuffcloud</span></a><nav class="nav" aria-label="Main"><a href="#">Tools</a><a href="#">Hosting</a><a href="#">Docs</a></nav></div><div class="hdr-r"><a href="#">Log in</a></div><button class="menu-btn" type="button" aria-label="Open menu"><svg width="20" height="14" viewBox="0 0 20 14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M0 1h20M0 7h20M0 13h20"/></svg></button></header>

<div class="split">
<form class="main narrow" onSubmit="{{noop}}" style="margin:0">
<div class="stack-s"><p class="eyebrow">report / abuse</p><h1 class="title">Report a site</h1></div>
<div class="fld"><label class="label" for="u">Address</label><input class="field" id="u" type="url" value="https://x7k2m9qa.example.org" style="color:var(--lilac)"></div>
<fieldset style="margin:0;padding:0;border:0;min-width:0"><legend class="label" style="padding:0;margin-bottom:12px">Reason</legend>
<div class="stack-s">
<label style="position:relative;display:block"><input class="opt" type="radio" name="r" checked><span class="box" style="justify-content:flex-start">Phishing or scam</span></label>
<label style="position:relative;display:block"><input class="opt" type="radio" name="r"><span class="box" style="justify-content:flex-start">Malware</span></label>
<label style="position:relative;display:block"><input class="opt" type="radio" name="r"><span class="box" style="justify-content:flex-start">Illegal content</span></label>
<label style="position:relative;display:block"><input class="opt" type="radio" name="r"><span class="box" style="justify-content:flex-start">Spam</span></label>
<label style="position:relative;display:block"><input class="opt" type="radio" name="r"><span class="box" style="justify-content:flex-start">Something else</span></label>
</div></fieldset>
<div class="fld"><label class="label" for="d">Details (optional)</label><textarea class="field" id="d" style="min-height:140px"></textarea></div>
<div class="fld"><label class="label" for="m">Your e-mail (optional)</label><input class="field" id="m" type="email" autocomplete="email"></div>
<div class="row row-m"><button class="btn" type="submit">Send report</button><a class="btn btn-ghost" href="#">Cancel</a></div>
</form>
<aside class="panel" style="flex:1 1 480px;border-left:1px solid var(--line);--mh:640px;--mhm:200px">
<div class="b1"></div><div class="b2"></div><div class="b3"></div>
<img class="st" src="lock.svg" alt="" style="left:70px;top:190px;width:72px;transform:rotate(-8deg)">
<img class="st hide-m" src="doc.svg" alt="" style="left:200px;top:80px;width:70px;transform:rotate(6deg)">
<img class="st" src="globe.svg" alt="" style="right:70px;top:140px;width:64px;transform:rotate(10deg)">
<img class="axo bob" src="axo.svg" alt="Stuffy, the stuffcloud mascot">
</aside>
</div>

<footer class="foot"><div>stuffcloud · GPL-3.0 · no trackers</div><span><a href="#">Source</a><a href="#">Privacy</a><a href="#">Report abuse</a></span></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1000}}'>

return { noop: (e) => { if (e && e.preventDefault) e.preventDefault(); } };
}

</script>
</body>
</html>
